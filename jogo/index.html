<title>Prancheta FC</title>
<meta name="description" content="Manager de futebol brasileiro: Séries A a D, Copa do Brasil, estaduais, Libertadores e Sul-Americana.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Prancheta FC. Layout: celular com abas embaixo; tablet com trilho de icones; computador com menu lateral e grade de 3 colunas. */
:root {
  --quadro: #E9EEEA; --sup: #F8FAF8; --sup2: #DFE6E1; --tinta: #10201A; --tinta2: #4D5F56; --linha: #C7D2CB;
  --gram: #22744A; --gram2: #1E6842; --giz: rgba(240, 248, 243, .85);
  --ima: #2350C8; --ima-tx: #FFFFFF; --ima-suave: #DCE5FA;
  --ouro: #E8B400; --ouro-tx: #241A00; --ouro-suave: #FBF0C7;
  --cartao: #D3263A; --cartao-suave: #F9DADE; --verde: #1E8C4E; --verde-suave: #D5EEDD; --alerta: #C98A00; --ambar: #8F6200;
  --sombra: 0 1px 2px rgba(16, 32, 26, .06), 0 6px 18px rgba(16, 32, 26, .08);
  --f-display: 'Big Shoulders Display', 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-texto: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --placar: #10201A; --placar-tx: #F2F6F3;
  --r: 14px; --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --quadro: #0D1512; --sup: #15201B; --sup2: #1D2A24; --tinta: #E6EEE9; --tinta2: #9DB0A6; --linha: #2A3A32;
  --gram: #1B5E3B; --gram2: #185535; --giz: rgba(215, 232, 221, .7);
  --ima: #5B83F2; --ima-tx: #0B1430; --ima-suave: #1C2A4D;
  --ouro: #F2C42C; --ouro-tx: #241A00; --ouro-suave: #3A3110;
  --cartao: #F0566A; --cartao-suave: #3D1A20; --verde: #3FBF78; --verde-suave: #143322; --alerta: #E9B23A; --ambar: #E9B23A;
  --placar: #060C09; --placar-tx: #EEF4F0;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --quadro: #0D1512; --sup: #15201B; --sup2: #1D2A24; --tinta: #E6EEE9; --tinta2: #9DB0A6; --linha: #2A3A32;
  --gram: #1B5E3B; --gram2: #185535; --giz: rgba(215, 232, 221, .7);
  --ima: #5B83F2; --ima-tx: #0B1430; --ima-suave: #1C2A4D;
  --ouro: #F2C42C; --ouro-tx: #241A00; --ouro-suave: #3A3110;
  --cartao: #F0566A; --cartao-suave: #3D1A20; --verde: #3FBF78; --verde-suave: #143322; --alerta: #E9B23A; --ambar: #E9B23A;
  --placar: #060C09; --placar-tx: #EEF4F0;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--quadro); color: var(--tinta); font: 16px/1.45 var(--f-texto); -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ima); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--f-display); letter-spacing: .01em; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--tinta2); font-weight: 700; }
.muted { color: var(--tinta2); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }

/* ---------- casca ---------- */
.shell { min-height: 100%; display: grid; grid-template-columns: 1fr; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: color-mix(in srgb, var(--quadro) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha); }
.topbar .club { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar .club b { font-family: var(--f-display); font-size: 22px; font-weight: 800; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .meta { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 14px; }
.topbar .meta .pill { display: inline-flex; gap: 6px; align-items: center; }
.brand { font-family: var(--f-display); font-weight: 900; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; }
.brand i { font-style: normal; color: var(--ima); }
main { padding: 16px; padding-block: 16px 24px; max-width: 1240px; width: 100%; margin: 0 auto; min-width: 0; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--sup); border-top: 1px solid var(--linha); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--nav-h); font-size: 12px; color: var(--tinta2); font-weight: 700; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--ima); }
.nav .only-wide { display: none; }
.nav .nav-brand { display: none; }

@media (min-width: 640px) {
  .shell { grid-template-columns: 76px 1fr; padding-bottom: 0; }
  .nav { position: sticky; top: 0; height: 100vh; height: 100dvh; grid-template-columns: 1fr; grid-auto-rows: 72px; align-content: start; border-top: 0; border-right: 1px solid var(--linha); padding: 8px 0; }
  .nav button { height: 72px; }
  .nav .only-wide { display: flex; }
  .content { grid-column: 2; min-width: 0; }
}
@media (min-width: 1024px) {
  .shell { grid-template-columns: 220px 1fr; }
  .nav { grid-auto-rows: 52px; padding: 16px 12px; gap: 4px; }
  .nav .nav-brand { display: block; padding: 4px 12px 20px; font-family: var(--f-display); font-weight: 900; font-size: 26px; text-transform: uppercase; color: var(--tinta); }
  .nav .nav-brand i { font-style: normal; color: var(--ima); }
  .nav button { flex-direction: row; justify-content: flex-start; gap: 12px; height: 52px; padding: 0 12px; font-size: 15px; border-radius: 10px; }
  .nav button[aria-current="page"] { background: var(--ima-suave); }
  .topbar .brand-mobile { display: none; }
}

/* ---------- grades ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
.grid.g2 > :only-child { grid-column: 1 / -1; }
@media (min-width: 720px) { .grid.g2 { grid-template-columns: 1fr 1fr; } .grid.g-hub { grid-template-columns: 1.2fr 1fr; } }
@media (min-width: 1180px) { .grid.g-hub { grid-template-columns: 1.25fr 1fr 1fr; } }
.stack { display: grid; gap: 16px; min-width: 0; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }

/* ---------- cartoes e botoes ---------- */
.card { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--r); padding: 16px; min-width: 0; }
.card h2 { font-family: var(--f-display); font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
.card .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; margin-bottom: 12px; }
.card .head > * { min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--sup); font-weight: 700; text-decoration: none; transition: transform .08s ease, background .15s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ima); color: var(--ima-tx); border-color: var(--ima); }
.btn.gold { background: var(--ouro); color: var(--ouro-tx); border-color: var(--ouro); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ima); padding-inline: 8px; }
.btn.danger { color: var(--cartao); border-color: var(--cartao); }
.btn.block { width: 100%; }
.btn.big { min-height: 56px; font-size: 18px; border-radius: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chip { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--linha); background: var(--sup); font-size: 14px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--tinta); color: var(--sup); border-color: var(--tinta); }
.chip.lock { color: var(--tinta2); border-style: dashed; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip .lk { font-size: 12px; font-weight: 700; opacity: .85; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--sup2); color: var(--tinta2); white-space: nowrap; }
.tag.good { background: var(--verde-suave); color: var(--verde); }
.tag.bad { background: var(--cartao-suave); color: var(--cartao); }
.tag.gold { background: var(--ouro-suave); color: var(--ouro-tx); }
:root[data-theme="dark"] .tag.gold { color: var(--ouro); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.gold { color: var(--ouro); } }
.tag.blue { background: var(--ima-suave); color: var(--ima); }

/* ---------- escudo (cores do clube, sem marca) ---------- */
.badge { --c1: #ccc; --c2: #333; display: inline-grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--c1); box-shadow: inset 0 0 0 3px var(--c2), 0 0 0 1px var(--linha); font-family: var(--f-display); font-weight: 900; font-size: 13px; letter-spacing: .02em; }
.badge.lg { width: 64px; height: 64px; font-size: 22px; box-shadow: inset 0 0 0 5px var(--c2), 0 0 0 1px var(--linha); }
.badge.sm { width: 26px; height: 26px; font-size: 10px; box-shadow: inset 0 0 0 2px var(--c2), 0 0 0 1px var(--linha); }

/* ---------- nota (o unico numero do jogador) ---------- */
.ovr { display: inline-grid; place-items: center; min-width: 40px; height: 32px; padding: 0 6px; border-radius: 8px; font-family: var(--f-display); font-weight: 900; font-size: 22px; line-height: 1; background: var(--sup2); }
.ovr.t1 { background: var(--ouro); color: var(--ouro-tx); }
.ovr.t2 { background: var(--verde-suave); color: var(--verde); }
.ovr.t3 { background: var(--sup2); color: var(--tinta); }
.ovr.t4 { background: var(--cartao-suave); color: var(--cartao); }
.fadiga { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--sup2); overflow: hidden; vertical-align: middle; }
.fadiga > i { display: block; height: 100%; border-radius: 3px; background: var(--verde); }
.fadiga.mid > i { background: var(--alerta); }
.fadiga.low > i { background: var(--cartao); }

/* ---------- medidores ---------- */
.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.meter { background: var(--sup2); border-radius: 12px; padding: 12px; min-width: 0; }
.meter .v { font-family: var(--f-display); font-weight: 900; font-size: 28px; line-height: 1.05; white-space: nowrap; }
.meter { container-type: inline-size; }
.meter .v.money { font-size: 21px; font-size: clamp(16px, 28cqi, 26px); }
.meter .v.money small { font-size: .62em; margin-right: 2px; opacity: .8; }
.meter .bar { height: 6px; border-radius: 3px; background: var(--linha); margin-top: 8px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--ima); }
.meter.warn .bar i { background: var(--cartao); }
.meter .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--tinta2); }

/* ---------- hero do proximo jogo ---------- */
.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 20px; color: #fff; background:
  repeating-linear-gradient(90deg, var(--gram) 0 44px, var(--gram2) 44px 88px); border: 1px solid var(--gram2); }
.hero::before { content: ""; position: absolute; inset: 12px; border: 2px solid var(--giz); border-radius: 6px; pointer-events: none; }
.hero::after { content: ""; position: absolute; top: 12px; bottom: 12px; left: 50%; border-left: 2px solid var(--giz); opacity: .45; pointer-events: none; }
.hero .inner { position: relative; z-index: 1; display: grid; gap: 16px; }
.hero .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.hero .vs .t { display: grid; justify-items: center; gap: 6px; min-width: 0; }
.hero .vs .t b { font-family: var(--f-display); font-size: 22px; font-weight: 900; text-transform: uppercase; line-height: 1; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
.hero .vs .x { font-family: var(--f-display); font-weight: 900; font-size: 34px; opacity: .9; }
.hero .forca { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.hero .forca .track { height: 8px; border-radius: 4px; background: rgba(0,0,0,.28); overflow: hidden; display: flex; }
.hero .forca .track i { background: #fff; display: block; }
.hero .forca .track em { background: rgba(255,255,255,.35); display: block; }
.hero .scout { background: rgba(0,0,0,.25); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.hero .eyebrow { color: rgba(255,255,255,.85); }

/* ---------- objetivos ---------- */
.obj { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linha); }
.obj:first-of-type { border-top: 0; }
.obj .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--linha); display: grid; place-items: center; }
.obj.done .box { background: var(--verde); border-color: var(--verde); color: #fff; }
.obj.done .t { text-decoration: line-through; color: var(--tinta2); }
.xp { font-family: var(--f-display); font-weight: 800; color: var(--alerta); font-size: 16px; }

/* ---------- tabela ---------- */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 15px; }
table.tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2); text-align: right; padding: 8px 6px; font-weight: 700; }
table.tbl th:nth-child(2) { text-align: left; }
table.tbl td { padding: 8px 6px; text-align: right; border-top: 1px solid var(--linha); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tbl td:nth-child(2) { text-align: left; }
table.tbl td.pos { font-family: var(--f-display); font-weight: 900; font-size: 18px; text-align: center; width: 36px; }
table.tbl tr.me td { background: var(--ima-suave); font-weight: 700; }
table.tbl tr.g4 td.pos { color: var(--ima); }
table.tbl tr.z4 td.pos { color: var(--cartao); }
table.tbl .cl { display: flex; align-items: center; gap: 8px; }
table.tbl .pts { font-family: var(--f-display); font-weight: 900; font-size: 19px; }
.form { display: inline-flex; gap: 3px; }
.form i { width: 8px; height: 8px; border-radius: 50%; display: block; background: var(--linha); }
.form i.V { background: var(--verde); } .form i.E { background: var(--tinta2); } .form i.D { background: var(--cartao); }
@media (max-width: 560px) { .hide-sm { display: none !important; } }
@media (min-width: 561px) { .only-sm { display: none !important; } }

/* ---------- campo de escalacao ---------- */
.pitch { position: relative; width: 100%; max-width: 520px; margin: 0 auto; aspect-ratio: 68 / 92; border-radius: 16px; overflow: hidden;
  background: repeating-linear-gradient(0deg, var(--gram) 0 10%, var(--gram2) 10% 20%); border: 1px solid var(--gram2); }
.pitch .lines { position: absolute; inset: 3%; border: 2px solid var(--giz); border-radius: 4px; pointer-events: none; }
.pitch .lines::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--giz); }
.pitch .lines::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px solid var(--giz); border-radius: 50%; }
.pitch .box-top, .pitch .box-bot { position: absolute; left: 25%; right: 25%; height: 13%; border: 2px solid var(--giz); pointer-events: none; }
.pitch .box-top { top: 3%; border-top: 0; } .pitch .box-bot { bottom: 3%; border-bottom: 0; }
.mag { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 0; width: 76px; color: #fff; }
.mag .disc { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 22px; line-height: 1; background: var(--c1, var(--ima)); color: var(--cx, #fff); box-shadow: inset 0 0 0 3px var(--c2, #fff), 0 3px 0 rgba(0,0,0,.35), 0 6px 12px rgba(0,0,0,.25); transition: transform .15s; }
.mag .nm { max-width: 90px; font-size: 12px; font-weight: 700; line-height: 1.1; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mag .fadiga { width: 36px; height: 4px; background: rgba(0,0,0,.35); }
.mag .slot { font-size: 10px; font-weight: 700; opacity: .9; }
.mag.sel .disc { transform: scale(1.12); box-shadow: inset 0 0 0 3px var(--ouro), 0 0 0 4px var(--ouro), 0 6px 14px rgba(0,0,0,.35); }
.mag.empty .disc { background: rgba(0,0,0,.3); box-shadow: inset 0 0 0 2px var(--giz); }
.mag.off .disc::after { content: "!"; position: absolute; transform: translate(18px, -18px); width: 18px; height: 18px; border-radius: 50%; background: var(--cartao); color: #fff; font-size: 13px; display: grid; place-items: center; }
@media (max-width: 400px) { .mag { width: 62px; } .mag .disc { width: 42px; height: 42px; font-size: 20px; } .mag .nm { max-width: 80px; font-size: 11px; padding: 1px 4px; } }

.lineup-layout { display: grid; gap: 16px; }
@media (min-width: 900px) { .lineup-layout { grid-template-columns: minmax(340px, 520px) 1fr; align-items: start; } .lineup-layout .side { position: sticky; top: 76px; } }

/* ---------- linhas de jogador ---------- */
.plist { display: grid; }
.prow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--linha); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; min-height: 56px; }
.prow:first-child { border-top: 0; }
.prow .who { min-width: 0; }
.prow .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .who span { font-size: 13px; color: var(--tinta2); }
.prow .end { display: grid; justify-items: end; gap: 4px; font-size: 13px; }
.prow:hover { background: var(--sup2); }
.prow.cur { background: var(--ima-suave); }
.prow.dim { opacity: .55; }
.sector-h { margin: 16px 0 4px; }

/* ---------- postura ---------- */
.ruler { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: var(--sup2); padding: 4px; border-radius: 12px; }
.ruler button { border: 0; background: transparent; min-height: 52px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--tinta2); padding: 6px 2px; line-height: 1.1; display: grid; justify-items: center; align-content: end; gap: 5px; min-width: 0; }
.ruler .rk { display: block; width: 8px; height: calc(6px + var(--h) * 4px); border-radius: 2px; background: currentColor; opacity: .45; }
.ruler button[aria-pressed="true"] .rk { opacity: 1; background: var(--ima); }
.ruler .rl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) { .ruler .rl { display: none; } .ruler button { min-height: 44px; align-content: center; } }
.ment-now { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: 18px; letter-spacing: .02em; }
.ruler button[aria-pressed="true"] { background: var(--sup); color: var(--tinta); box-shadow: var(--sombra); }
.ruler-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--tinta2); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }

/* ---------- painel inferior / lateral ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(5, 12, 9, .5); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; max-height: 88dvh; overflow: auto; background: var(--sup); border-radius: 20px 20px 0 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); animation: up .2s ease; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--linha); margin: 0 auto 12px; }
@media (min-width: 900px) { .sheet-back { align-items: center; } .sheet { border-radius: 20px; max-height: 82vh; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- partida ---------- */
.match { display: grid; gap: 12px; }
.score { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--placar); color: var(--placar-tx); border-radius: 0 0 16px 16px; margin: -16px -16px 0; padding: 12px 16px 10px; }
@media (min-width: 640px) { .score { border-radius: 16px; margin: 0; top: 8px; } }
.score .sb { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.score .t { display: flex; align-items: center; gap: 8px; min-width: 0; font-family: var(--f-display); font-weight: 900; font-size: 20px; text-transform: uppercase; }
.score .t span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score .t.away { justify-content: flex-end; text-align: right; }
.score .g { font-family: var(--f-display); font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: .02em; text-align: center; min-width: 110px; }
.score .g.flash { animation: flash .9s ease; }
@keyframes flash { 0% { color: var(--ouro); transform: scale(1.25); } 100% { color: inherit; transform: none; } }
.score .clock { display: flex; justify-content: center; gap: 8px; align-items: center; font-size: 13px; margin-top: 6px; opacity: .9; }
.score .prog { position: relative; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); margin-top: 8px; }
.score .prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ouro); border-radius: 2px; }
.score .prog b { position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%; transform: translateX(-50%); }
.mini-pitch { position: relative; height: 120px; max-width: 100%; border-radius: 14px; overflow: hidden; background: repeating-linear-gradient(90deg, var(--gram) 0 8%, var(--gram2) 8% 16%); border: 1px solid var(--gram2); }
.mini-pitch .l { position: absolute; inset: 8px; border: 2px solid var(--giz); border-radius: 3px; }
.mini-pitch .l::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 2px solid var(--giz); }
.mini-pitch .gl, .mini-pitch .gr { position: absolute; top: 30%; bottom: 30%; width: 14%; border: 2px solid var(--giz); }
.mini-pitch .gl { left: 8px; border-left: 0; } .mini-pitch .gr { right: 8px; border-right: 0; }
.ball { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.4); transform: translate(-50%, -50%); transition: left .6s cubic-bezier(.3,.7,.3,1), top .6s cubic-bezier(.3,.7,.3,1); }
.mini-pitch .goal-flash { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 56px; color: var(--ouro); text-shadow: 0 3px 0 rgba(0,0,0,.4); animation: pop 1.4s ease forwards; pointer-events: none; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 20% { transform: scale(1.15); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { opacity: 0; } }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; padding: 8px 10px; }
.stat .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2); font-weight: 700; text-align: center; }
.stat .vv { display: flex; justify-content: space-between; font-family: var(--f-display); font-weight: 900; font-size: 22px; }
.stat .split { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--sup2); margin-top: 4px; }
.stat .split i { background: var(--ima); } .stat .split em { background: var(--tinta2); }
.feed { display: grid; gap: 0; }
.ev { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 4px; border-top: 1px solid var(--linha); animation: fade .3s ease; }
.ev:first-child { border-top: 0; }
.ev .m { font-family: var(--f-display); font-weight: 900; font-size: 18px; color: var(--tinta2); }
.ev.goal { background: var(--ouro-suave); border-radius: 10px; border-top-color: transparent; }
.ev.goal .m { color: var(--ouro-tx); }
:root[data-theme="dark"] .ev.goal .m { color: var(--ouro); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ev.goal .m { color: var(--ouro); } }
.ev.mine .who { color: var(--ima); }
.ev .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--tinta2); margin-right: 6px; }
.match-layout { display: grid; gap: 12px; }
@media (min-width: 1024px) { .match-layout { grid-template-columns: 1.1fr 1fr; align-items: start; } .mini-pitch { height: auto; aspect-ratio: 2 / 1; } .match-layout .feed { max-height: 56vh; overflow: auto; } }
@media (min-width: 640px) and (max-width: 1023px) { .mini-pitch { height: 170px; } }
.controls { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px); z-index: 24; display: flex; gap: 8px; background: var(--sup); border: 1px solid var(--linha); border-radius: 16px; padding: 8px; box-shadow: var(--sombra); }
@media (min-width: 640px) { .controls { bottom: 12px; } }
.controls .btn { min-height: 44px; padding: 8px 12px; white-space: nowrap; }
.shell.focus .nav { display: none; }
.shell.focus { padding-bottom: 0; }
.shell.focus .controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
@media (min-width: 640px) { .shell.focus { grid-template-columns: 1fr; } .shell.focus .content { grid-column: 1; } }
@media (max-width: 560px) { .score .t span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .score .g { font-size: 48px; min-width: 0; } .controls { gap: 6px; padding: 6px; } .controls .btn { padding: 8px 10px; } .seg button { min-width: 36px; } }
.seg { display: inline-flex; background: var(--sup2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; min-width: 40px; min-height: 38px; border-radius: 8px; font-weight: 800; font-family: var(--f-display); font-size: 17px; color: var(--tinta2); }
.seg button[aria-pressed="true"] { background: var(--sup); color: var(--tinta); }

.moment .opt { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--sup); }
.moment .opt[aria-pressed="true"] { border-color: var(--ima); background: var(--ima-suave); }
.moment .opt b { font-size: 16px; }
.moment .opt span { grid-column: 1 / -1; font-size: 14px; color: var(--tinta2); }
.moment .opts { display: grid; gap: 8px; }
.situ { background: var(--placar); color: var(--placar-tx); border-radius: 14px; padding: 14px 16px; }
.situ .disp { font-size: 30px; font-weight: 900; line-height: 1; }

/* ---------- pos-jogo ---------- */
.result { text-align: center; border-radius: 18px; padding: 20px 16px; color: #fff; }
.result.V { background: var(--verde); } .result.E { background: #5C6B64; } .result.D { background: var(--cartao); }
.result .big { font-family: var(--f-display); font-weight: 900; font-size: 64px; line-height: 1; }
.result .word { font-family: var(--f-display); font-weight: 900; font-size: 28px; text-transform: uppercase; letter-spacing: .04em; }
.xpbar { height: 12px; border-radius: 6px; background: var(--sup2); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ouro), #F7D766); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.reveal > * { animation: rise .45s ease both; }
.reveal > *:nth-child(2) { animation-delay: .08s; } .reveal > *:nth-child(3) { animation-delay: .16s; } .reveal > *:nth-child(4) { animation-delay: .24s; } .reveal > *:nth-child(5) { animation-delay: .32s; } .reveal > *:nth-child(6) { animation-delay: .4s; } .reveal > *:nth-child(7) { animation-delay: .48s; }
@keyframes rise { from { transform: translateY(10px); opacity: .01; } to { transform: none; opacity: 1; } }
.evo { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--linha); }
.evo:first-child { border-top: 0; }
.evo .up { color: var(--verde); font-weight: 800; }
.evo .dn { color: var(--cartao); font-weight: 800; }
.fin { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; }
.fin .tot { border-top: 1px solid var(--linha); padding-top: 6px; font-weight: 800; }
.pos-c { color: var(--verde); } .neg-c { color: var(--cartao); }
.stop { text-align: center; color: var(--tinta2); font-size: 14px; }

/* ---------- conquistas ---------- */
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ach { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center; padding: 10px; border-radius: 12px; background: var(--sup2); }
.ach .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--linha); color: var(--tinta2); }
.ach.on .ic { background: var(--ouro); color: var(--ouro-tx); }
.ach b { font-size: 14px; display: block; } .ach span { font-size: 12px; color: var(--tinta2); }
.ach:not(.on) b { color: var(--tinta2); }

/* ---------- toasts e confete ---------- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px); z-index: 90; display: grid; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
@media (min-width: 640px) { #toasts { bottom: 24px; } }
.toast { background: var(--tinta); color: var(--sup); border-radius: 14px; padding: 12px 14px; box-shadow: var(--sombra); display: flex; gap: 10px; align-items: center; animation: up .25s ease; font-size: 15px; }
.toast.gold { background: var(--ouro); color: var(--ouro-tx); }
.toast .ti { font-family: var(--f-display); font-weight: 900; font-size: 20px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 95; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } .confetti { display: none; } }

/* ---------- onboarding ---------- */
.onb { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
.onb h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(40px, 8vw, 72px); line-height: .95; text-transform: uppercase; }
.onb h1 i { font-style: normal; color: var(--ima); }
.club-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.club-card { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; text-align: left; padding: 12px; border-radius: 14px; border: 1.5px solid var(--linha); background: var(--sup); min-height: 72px; }
.club-card:hover { border-color: var(--ima); }
.club-card b { display: block; font-size: 16px; line-height: 1.15; }
.club-card .ovr { font-size: 18px; height: 26px; min-width: 34px; }
.persona { display: grid; gap: 4px; text-align: left; padding: 14px; border-radius: 14px; border: 1.5px solid var(--linha); background: var(--sup); }
.persona[aria-pressed="true"] { border-color: var(--ima); background: var(--ima-suave); }
.personas { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
input.txt { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--sup); font-size: 17px; }
.empty { padding: 24px; text-align: center; color: var(--tinta2); }
.notice { border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.notice.info { background: var(--ima-suave); }
.notice.warn { background: var(--ouro-suave); }
.notice.bad { background: var(--cartao-suave); }
.notice.good { background: var(--verde-suave); }
.news li { padding: 8px 0; border-top: 1px solid var(--linha); font-size: 15px; list-style: none; }
.news { margin: 0; padding: 0; }
.news li:first-child { border-top: 0; }
.news .r { font-family: var(--f-display); font-weight: 800; color: var(--tinta2); margin-right: 8px; }
.lvl { display: flex; align-items: center; gap: 12px; }
.lvl .n { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--tinta); color: var(--sup); font-family: var(--f-display); font-weight: 900; font-size: 30px; }
.unlocks { display: grid; gap: 6px; margin-top: 12px; }
.unlocks div { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.code { font-family: var(--f-display); font-weight: 900; font-size: 44px; letter-spacing: .18em; }
.auction .timer { font-family: var(--f-display); font-weight: 900; font-size: 40px; line-height: 1; }
.coachmark { position: relative; }
.coachmark .tip { position: relative; margin: 0 auto 12px; width: min(340px, 100%); background: var(--ouro); color: var(--ouro-tx); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; box-shadow: var(--sombra); z-index: 5; }
.coachmark .tip::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 8px solid transparent; border-top-color: var(--ouro); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.toggle { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; cursor: pointer; }
.toggle input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--ima); }
.toggle > span { display: grid; gap: 2px; }

/* escudos carregados pelo usuario */
.badge.crest { background: transparent; box-shadow: none; border-radius: 0; overflow: visible; }
.badge.crest img { width: 100%; height: 100%; object-fit: contain; display: block; }
:root[data-theme="dark"] .badge.crest img { filter: drop-shadow(0 0 1px rgba(255,255,255,.45)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.crest img { filter: drop-shadow(0 0 1px rgba(255,255,255,.45)); } }
.crest-list { display: grid; gap: 0; }
.crest-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--linha); min-width: 0; }
.crest-row:first-child { border-top: 0; }
.crest-row > span.small { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }


/* ---------- visual do tecnico ---------- */
.avatar { display: block; flex: none; border-radius: 50%; background: var(--sup2); box-shadow: 0 0 0 2px var(--sup), 0 0 0 3.5px var(--linha); }
.av-wrap { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start; }
.av-prev { position: sticky; top: 8px; display: grid; justify-items: center; gap: 8px; }
.av-ed { min-width: 0; }
@media (max-width: 560px) {
  .av-wrap { grid-template-columns: 1fr; gap: 12px; }
  .av-prev { position: sticky; top: -16px; z-index: 2; background: var(--sup); padding-block: 8px; margin-inline: -4px; }
  .av-prev .avatar { width: 112px; height: 112px; }
}
.swatch { width: 36px; height: 36px; flex: none; border-radius: 50%; padding: 0; border: 2px solid var(--linha); background: var(--sw); box-shadow: inset 0 0 0 2px var(--sup); transition: transform .12s ease; }
.swatch:hover { transform: scale(1.06); }
.swatch[aria-pressed="true"] { border-color: var(--tinta); box-shadow: inset 0 0 0 3px var(--sup), 0 0 0 2px var(--tinta); }
.av-lvl { position: relative; flex: none; padding: 0; border: 0; background: none; border-radius: 50%; }
.av-lvl .n-badge { position: absolute; right: -4px; bottom: -4px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; background: var(--tinta); color: var(--sup); font-family: var(--f-display); font-weight: 900; font-size: 15px; line-height: 1; box-shadow: 0 0 0 2px var(--sup); }

/* ---------- patrocinio ---------- */
.spons { border: 2px solid var(--ouro); }
.offers { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
.offer { display: grid; gap: 10px; align-content: start; padding: 12px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--quadro); min-width: 0; }
.offer .tag { justify-self: start; }
.offer .fin { font-size: 14px; }
.offer .offer-txt { margin: 0; }
.brandmark { display: grid; gap: 1px; padding: 10px 12px; border-radius: 10px; background: var(--placar); color: var(--placar-tx); border-left: 6px solid var(--bs, var(--ima)); min-width: 0; }
.brandmark b { font-family: var(--f-display); font-weight: 900; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }
.brandmark span { font-size: 12px; font-weight: 700; opacity: .85; }
.brandmark.sm { display: inline-grid; padding: 3px 8px; border-radius: 6px; }
.brandmark.sm b { font-size: 15px; }

/* ---------- ajuda ao passar o mouse (so computador) ---------- */
.hint { display: none; }
@media (hover: hover) and (pointer: fine) {
  .hint { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-left: 6px; vertical-align: middle; position: relative; top: -2px; border-radius: 50%; color: currentColor; opacity: .5; cursor: help; text-transform: none; letter-spacing: 0; }
  .hint:hover, .hint:focus-visible { opacity: 1; }
  .eyebrow .hint { width: 16px; height: 16px; margin-left: 4px; top: -1px; }
  .eyebrow .hint svg { width: 13px; height: 13px; }
}
.tipbox { position: fixed; z-index: 95; left: 0; top: 0; max-width: 300px; padding: 8px 11px; border-radius: 10px; background: var(--placar); color: var(--placar-tx); border: 1px solid var(--linha); font: 400 13px/1.45 var(--f-texto); text-transform: none; letter-spacing: 0; box-shadow: var(--sombra); pointer-events: none; opacity: 0; visibility: hidden; transform: translateY(3px); transition: opacity .12s ease, transform .12s ease, visibility 0s linear .12s; }
.tipbox.on { opacity: 1; visibility: visible; transform: none; transition: opacity .12s ease, transform .12s ease, visibility 0s; }
@media (prefers-reduced-motion: reduce) { .tipbox, .tipbox.on { transition: none; transform: none; } }

/* ---------- séries, competições e atributos ---------- */
.attrs { display: inline-flex; gap: 2px; align-items: baseline; margin-left: 4px; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--tinta2); white-space: nowrap; }
.attrs i { font-style: normal; font-weight: 700; font-size: 10px; letter-spacing: .04em; margin-left: 4px; opacity: .8; }
.attr-bars { display: grid; gap: 8px; margin-top: 14px; }
.attr-bars .ab { display: grid; grid-template-columns: minmax(84px, auto) 1fr 36px; gap: 10px; align-items: center; font-size: 14px; }
.attr-bars .bar { height: 8px; border-radius: 4px; background: var(--sup2); overflow: hidden; }
.attr-bars .bar i { display: block; height: 100%; background: var(--ima); border-radius: 4px; }
.attr-bars b { text-align: right; font-family: var(--f-display); font-size: 20px; font-weight: 900; }
.tbl tr.up td.pos { color: var(--verde); }
.tbl tr.sula td.pos { color: var(--ambar); }
.tbl tr.up td:first-child { box-shadow: inset 3px 0 0 var(--verde); }
.tie { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--linha); font-size: 14px; }
.tie:first-of-type { border-top: 0; }
.tie .side { display: flex; gap: 6px; align-items: center; justify-content: flex-end; min-width: 0; text-align: right; }
.tie .side.r { justify-content: flex-start; text-align: left; }
.tie .side.win { font-weight: 800; }
.tie .side.lose { color: var(--tinta2); }
.tie .sc { font-family: var(--f-display); font-weight: 800; font-size: 17px; text-align: center; min-width: 74px; display: grid; }
.tie .sc small { font-family: var(--f-texto); font-weight: 400; font-size: 11px; color: var(--tinta2); }
.tie.mine { background: var(--ima-suave); border-radius: 10px; padding-inline: 8px; border-top-color: transparent; }
details.more { margin-top: 6px; }
details.more summary { cursor: pointer; color: var(--ima); font-weight: 700; font-size: 14px; padding: 6px 0; }
.game { padding: 6px 0; border-top: 1px solid var(--linha); }
.game.mine { font-weight: 800; }
.champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; margin-top: 6px; font-size: 14px; }
.champs > div { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.champs .muted { width: 100%; font-size: 12px; }
.seg.wide { display: flex; width: 100%; overflow-x: auto; }
.seg.wide button { flex: 1 0 auto; padding: 0 14px; font-size: 15px; white-space: nowrap; }
.narrow-only { display: none; }
@media (max-width: 480px) { .wide-only { display: none; } .narrow-only { display: inline; } .seg.wide button { padding: 0 10px; } }
@media (max-width: 420px) { .seg.wide button { padding: 0 7px; font-size: 14px; } }
.comp-lbl { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta2); margin-bottom: 6px; }
select.txt { appearance: auto; }

/* ---------- estrutura do clube (fase 2) ---------- */
.infra .head { align-items: center; }
.infra h2 { display: flex; align-items: center; gap: 10px; }
.inf-ic { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--ima-suave); color: var(--ima); flex: none; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 12px; height: 12px; border-radius: 3px; background: var(--sup2); border: 1px solid var(--linha); }
.pips i.on { background: var(--ouro); border-color: var(--ouro); }
.build { background: var(--sup2); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.build .bar { height: 8px; border-radius: 4px; background: var(--linha); margin-top: 8px; overflow: hidden; }
.build .bar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--ouro) 0 8px, var(--alerta) 8px 16px); }
.fin .nx { display: block; color: var(--verde); font-weight: 700; font-size: .92em; }
.fin > span { min-width: 0; }
.why { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 0; font-size: 14px; }
.why li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--linha); }
.why li:first-child { border-top: 0; }
.why li > span:first-child { min-width: 0; }
.why li > span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.verba { border: 1.5px solid var(--linha); border-radius: 12px; padding: 12px; }
.seg.tix button { font-size: 15px; padding: 0 6px; min-width: 0; }
@media (max-width: 560px) { .prow.pros { grid-template-columns: auto 1fr; } .prow.pros > .row { grid-column: 1 / -1; justify-content: flex-end; } }
.sheet h2.sheet-t { font-size: 24px; }

/* ---------- bola parada e times salvos (fase 4) ---------- */
.tk { display: grid; gap: 8px; }
.tk-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px; align-items: center; font-size: 15px; }
.tk-row select { width: 100%; min-height: 40px; }
.pr { display: grid; gap: 4px; }
.pr-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--linha); }
.pr-row > span:first-child { display: grid; gap: 2px; min-width: 0; }
.pr-row .btn { min-height: 38px; padding: 6px 12px; }
select.txt { min-height: 40px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--linha); background: var(--sup); color: var(--tinta); font-size: 15px; max-width: 100%; }

/* ---------- vida do técnico (fase 3) ---------- */
.press .quote { font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.15; margin: 0 0 12px; text-wrap: balance; }
.opt { display: grid; gap: 2px; text-align: left; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--sup); color: var(--tinta); }
.opt:hover { border-color: var(--ima); }
.opt b { font-size: 16px; }
.inf-ic.gold { background: var(--ouro-suave); color: var(--ouro-tx); }
.proms { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.proms li { display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--linha); }
.proms li:first-child { border-top: 0; padding-top: 0; }
:root[data-theme="dark"] .inf-ic.gold { color: var(--ouro); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .inf-ic.gold { color: var(--ouro); } }

/* ---------- mercado ---------- */
.rchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.rchip { display: inline-flex; gap: 4px; align-items: baseline; font-size: 13px; padding: 3px 8px; border-radius: 999px; background: var(--sup2); color: var(--tinta2); }
.rchip.up b { color: var(--verde); } .rchip.dn b { color: var(--cartao); }
.offer-card { padding: 12px 0; border-top: 1px solid var(--linha); }
.offer-card:first-of-type { border-top: 0; padding-top: 0; }
.counter { display: inline-flex; align-items: center; gap: 2px; }
.counter .btn.ghost { min-width: 36px; padding-inline: 6px; }
.disp-box { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--sup2); display: grid; gap: 6px; }
.disp-box > .row b { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; }
.disp-box.good > .row b { color: var(--verde); } .disp-box.ok > .row b { color: var(--ima); } .disp-box.warn > .row b { color: var(--alerta); } .disp-box.bad > .row b { color: var(--cartao); }
.dbar { position: relative; height: 10px; border-radius: 5px; background: var(--linha); overflow: hidden; }
.dbar i { display: block; height: 100%; background: var(--ima); }
.disp-box.good .dbar i { background: var(--verde); } .disp-box.warn .dbar i { background: var(--alerta); } .disp-box.bad .dbar i { background: var(--cartao); }
.dbar em { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--tinta); opacity: .5; }

/* ---------- contratar e vender (modelo do Brasileirinho) ---------- */
.gold-c { color: var(--alerta); }
.contratar .ct-t { font-size: 40px; text-transform: uppercase; line-height: 1; }
.contratar .ct-q { font-size: 19px; margin: 10px 0 12px; text-wrap: balance; }
.contratar .ct-p { gap: 10px; margin-bottom: 12px; }
.ct-box { border: 1.5px solid var(--linha); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.intbox { display: grid; gap: 8px; }
.intbox .row b.disp { font-size: 26px; text-transform: uppercase; line-height: 1; }
.intbox.good .row b.disp { color: var(--verde); } .intbox.warn .row b.disp { color: var(--alerta); } .intbox.bad .row b.disp { color: var(--cartao); }
.intbox.good .dbar i { background: var(--verde); } .intbox.warn .dbar i { background: var(--alerta); } .intbox.bad .dbar i { background: var(--cartao); }
.int-rows { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
.int-rows b { font-variant-numeric: tabular-nums; }
.opt3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.opt3 button { min-height: 52px; border-radius: 12px; border: 1.5px solid var(--linha); background: var(--sup); color: var(--tinta); font-weight: 700; font-size: 16px; padding: 6px 8px; }
.opt3 button[aria-pressed="true"] { background: var(--ima); border-color: var(--ima); color: var(--ima-tx); }
.ct-btns { justify-content: flex-end; gap: 10px; margin-top: 14px; }
.ct-btns .btn { min-width: 140px; }
.ct-cue { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ima); }
.pcard { border: 1px solid var(--linha); border-radius: 14px; padding: 12px; margin-top: 10px; background: var(--sup); }
.pcard.tit { border-color: var(--ima); }
.pc-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.pc-who { display: grid; gap: 2px; min-width: 0; }
.pc-who b { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-act { display: flex; gap: 6px; }
.pc-bot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
.grp { font-family: var(--f-display); text-transform: uppercase; color: var(--ima); font-size: 18px; margin: 16px 0 0; }
@media (max-width: 560px) { .pc-top { grid-template-columns: auto minmax(0, 1fr); } .pc-act { grid-column: 1 / -1; justify-content: flex-end; } .contratar .ct-t { font-size: 34px; } }

  const PERSONAS = {
    motivador: { label: 'Motivador', txt: 'Levanta o time nos momentos difíceis.', match: 'Perdendo no 2º tempo, o time cria 10% mais chances.' },
    tatico: { label: 'Tático', txt: 'Estuda cada adversário.', match: 'Meio-campo rende 3% a mais.' },
    disciplinador: { label: 'Disciplinador', txt: 'Regras claras, cobrança firme.', match: '25% menos cartões e rival com 3% menos chances.' },
    revelador: { label: 'Revelador', txt: 'Aposta na base.', match: 'Jogadores de até 23 anos rendem +2 e evoluem mais rápido.' },

  };

  // ---------- geracao de elencos (nomes gerados: elencos reais entram com a base de dados) ----------
  const FIRST = ['Gabriel', 'Lucas', 'Matheus', 'Pedro', 'João', 'Rafael', 'Gustavo', 'Felipe', 'Bruno', 'Thiago', 'Vitor', 'Caio', 'Diego', 'Rodrigo', 'Leonardo', 'Henrique', 'Arthur', 'Davi', 'Enzo', 'Igor', 'Kaique', 'Luan', 'Marcos', 'Nathan', 'Otávio', 'Renan', 'Samuel', 'Wesley', 'Yago', 'Alan', 'Breno', 'Cauã', 'Danilo', 'Erick', 'Fabrício', 'Hugo', 'Ítalo', 'Jean', 'Kauan', 'Lorran', 'Murilo', 'Nicolas', 'Paulo', 'Ruan', 'Talles', 'Vinícius', 'William', 'André', 'Eduardo', 'Raul'];
  const LAST = ['Silva', 'Santos', 'Oliveira', 'Souza', 'Lima', 'Pereira', 'Costa', 'Ferreira', 'Rodrigues', 'Almeida', 'Nascimento', 'Carvalho', 'Araújo', 'Ribeiro', 'Martins', 'Rocha', 'Barbosa', 'Gomes', 'Teixeira', 'Moreira', 'Cardoso', 'Mendes', 'Freitas', 'Nunes', 'Moura', 'Batista', 'Pinto', 'Campos', 'Vieira', 'Monteiro', 'Duarte', 'Farias', 'Sales', 'Bezerra', 'Cunha', 'Dias', 'Ramos', 'Paiva', 'Lopes', 'Brito'];
  const NICK = ['Biel', 'Kaká', 'Juninho', 'Dudu', 'Guga', 'Pedrinho', 'Netinho', 'Tiquinho', 'Zé Rafael', 'Marquinhos', 'Luizão', 'Fabinho', 'Paulinho', 'Rony', 'Vitinho', 'Tchê', 'Gabigol', 'Léo', 'Nenê', 'Cacá', 'Tuca', 'Nandinho', 'Kiko', 'Lelê', 'Tavinho', 'Duda', 'Bruninho'];
  const SQUAD_TEMPLATE = [['GK', 3], ['CB', 4], ['RB', 2], ['LB', 2], ['DM', 2], ['CM', 3], ['AM', 2], ['RW', 2], ['LW', 2], ['ST', 3]];

  function wageFor(ovr) { return Math.round(6000 * Math.pow(1.17, ovr - 55) / 1000) * 1000; } // por rodada
  function valueFor(ovr, age, pos) {

  function genPlayer(rng, pos, ovr, age, clubId, id) {

  }

  // jogador real: [nome, posição, idade, nota, atributo 1, valor 1, atributo 2, valor 2, gols, assistências, jogos em 2026, fonte]
  // fonte 1 = atributos escolhidos por estatística real de 2026; 0 = estimados pelo jogo
  function realPlayer(rng, row, clubId, id) {

  }
  // atributos estimados: sorteia 2 do perfil típico da posição; o primeiro fica um pouco acima do segundo

  }

  function genSquad(rng, club, startId) {
    const out = []; let id = startId;

      for (let i = 0; i < n; i++) {

        else if (i === 1) { ovr = rng.gauss(club.base - 2.5, 2.5); age = rng.int(21, 33); }
        else { ovr = rng.gauss(club.base - 9, 3); age = rng.int(17, 21); }

  }

  // ---------- calendario (pontos corridos, turno e returno) ----------
  function roundRobin(ids, rng) {
    const teams = ids.slice(); for (let i = teams.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [teams[i], teams[j]] = [teams[j], teams[i]]; }

    const second = rounds.map(g => g.map(([h, a]) => [a, h]));
    return rounds.concat(second);
  }

  // ---------- forca do time ----------
  function effRating(p, slot, ctx) {
    if (!p) return 30;

  }

  // quanto cada ponto de atributo acima da nota soma em cada setor [defesa, meio, ataque]
  const SECT = { des: [0.25, 0, 0], int: [0.25, 0, 0], aer: [0.18, 0, 0], blo: [0.18, 0, 0], sbo: [0, 0.2, 0], cru: [0, 0, 0.15], pas: [0, 0.25, 0], cri: [0, 0.1, 0.15], dri: [0, 0.05, 0.2], fin: [0, 0, 0.1], cab: [0, 0, 0.05], lon: [0, 0, 0.1], pes: [0, 0.03, 0] };

  function sectors(xi, ctx) {

        gk = e; if (own) Object.keys(p.at).forEach(k => { const d = p.at[k] - p.ovr; gk += (GKW[k] || 0) * d; if (k === 'pes') midX += 0.03 * d; if (sp[k] != null) sp[k] = Math.max(sp[k], d); });

  // ---------- partida, minuto a minuto ----------
  function rates(m, minute) {
    const H = m.side[0], A = m.side[1];

  function lineupFrom(club, players, lineup) {
    // lineup: { formation, slots:[pid], bench:[pid], corridor, ment }
    const f = FORMATIONS[lineup.formation];
    return f.slots.map(([slot], i) => ({ slot, p: players[lineup.slots[i]] || null, x: f.slots[i][1], y: f.slots[i][2] }));
  }

  function newMatch(opts) {
    // opts: { home:{club, xi, bench, ment, corridor, persona, morale, human}, away:{...}, rng, neutral }
    const mk = s => ({ club: s.club, crowd: s.crowd ?? null, alt: s.alt || 1, takers: s.takers || null, fit: s.fit || 1, ana: s.ana || 1, spBonus: s.spBonus || 0, xi: s.xi.map(o => ({ ...o })), bench: s.bench.slice(), ment: s.ment || 'equilibrada', persona: s.persona || null, morale: s.morale ?? 50, human: !!s.human, reds: 0, subs: 0, windows: 0, sec: null, shots: 0, xg: 0, onTarget: 0, poss: 0, cards: [], events: [], playedIds: new Set() });
    const m = { minute: 0, score: [0, 0], side: [mk(opts.home), mk(opts.away)], rng: opts.rng, neutral: !!opts.neutral, events: [], done: false, possAcc: 0, extra: [opts.rng.int(1, 3), opts.rng.int(2, 6)], half: 1 };
    m.side.forEach(s => { s.xi.forEach(o => { if (o.p) { s.playedIds.add(o.p.id); o.p.condLive = o.p.cond; } }); s.bench.forEach(p => { if (p) p.condLive = p.cond; }); recalc(m, s); });
    return m;
  }

  // capitão em campo dá liderança: +3 de moral efetiva no jogo
  // capitão em campo: liderança de até +3 de moral no jogo, conforme nota e experiência; cartões caem 8%
  function capBonus(p) { return p ? Math.max(0, Math.min(3, (TAKER.cap(p) - 74) / 4)) : 0; }
  function recalc(m, s) { const cap = takerOf(s, 'cap'); s.capBonus = cap ? capBonus(cap.p) : 0; s.capOn = s.capBonus > 0; s.sec = sectors(s.xi.filter(o => o.p), { persona: s.persona, morale: (s.morale ?? 50) + s.capBonus }); }

  // tipo de finalização: chance comum, cabeçada ou chute de fora (prob., multiplicador de qualidade)
  const SHOT = { normal: [0.62, 1.12], cabeca: [0.2, 0.95], fora: [0.18, 0.6] };
  const SHOT_KEYS = Object.keys(SHOT);
  // atributo que pesa em cada tipo, por família (o melhor dos dois vale)
  function shotVal(p, type) {
    if (type === 'cabeca') return Math.max(av(p, 'cab'), av(p, 'aer'));
    if (type === 'fora') return Math.max(av(p, 'lon'), av(p, 'fin') - 3);
    return Math.max(av(p, 'fin'), av(p, 'dri') - 3);
  }
  function pickScorer(rng, s, type = 'normal') {
    const cands = s.xi.filter(o => o.p && o.slot !== 'GK');

    const cands = s.xi.filter(o => o.p && o.slot !== 'GK' && o !== scorer);
    return rng.weighted(cands, o => {
      const p = o.p; const w = W[o.slot]; const own = GROUP[o.slot] === GROUP[p.pos];

  // ---------- bola parada e capitão ----------
  // valor de cobrança de cada jogador (goleiro não cobra)
  const TAKER = {
    pen: p => Math.max(av(p, 'fin'), av(p, 'lon') - 2),
    fk: p => Math.max(av(p, 'lon'), av(p, 'cri') - 3, av(p, 'pas') - 4),
    ck: p => Math.max(av(p, 'cru'), av(p, 'cri') - 2, av(p, 'pas') - 3),

  // avanca um minuto; devolve eventos do minuto
  function step(m) {
    if (m.done) return [];
    m.minute++;

    // cansaco dentro do jogo: quem esta em campo perde condicao a cada minuto
    m.side.forEach(s => { const k = 0.24 * MENT[s.ment].cond * (s.fit || 1); s.xi.forEach(o => { if (o.p) o.p.condLive = Math.max(1, o.p.condLive - k); }); if (minute % 5 === 0) recalc(m, s); });

    m.possAcc += r.sh;
    const late = 1 + 0.25 * (minute > 75);

        const scorer = pickScorer(rng, s, type);
        // atributo do finalizador muda a chance de virar gol; a defesa e o goleiro rivais respondem

        q *= Math.max(0.82, Math.min(1.25, 1 + 0.012 * ((ownS ? shotVal(sp, type) : sp.ovr - 10) - sp.ovr + P.convAdj)));

        if (ck) q *= Math.max(0.85, Math.min(1.2, 1 + 0.012 * (TAKER.ck(ck.p) + (s.spBonus || 0) - 75)));
        if (type === 'fora') q *= 1 - 0.012 * Math.max(0, dsp.blo || 0) - 0.012 * Math.max(0, dsp.col || 0);

          else if (ck) kind = 'escanteio';
          else if (type === 'cabeca') kind = 'de cabeça';
          else if (type === 'fora') kind = 'chute de fora';

          scorer.p._g = (scorer.p._g || 0) + 1; if (assist) assist.p._a = (assist.p._a || 0) + 1;
          ev.push({ t: 'goal', side: si, min: minute, p: scorer.p.id, pn: scorer.p.n, a: assist ? assist.p.id : null, an: assist ? assist.p.n : null, kind, type, xg: q, score: m.score.slice() });
        } else {
          const kind = rng.weighted(OUT_MISS, x => x[1])[0];
          if (kind === 'save') s.onTarget++;
          if (q > 0.16 || kind === 'post' || rng() < 0.35) ev.push({ t: 'chance', side: si, min: minute, p: scorer.p.id, pn: scorer.p.n, kind, xg: q, gk: o.xi[0].p ? o.xi[0].p.n : 'o goleiro' });
        }
      }
    });
    // bola parada: pênalti e falta direta
    m.side.forEach((s, si) => {
      const o = m.side[1 - si]; const gkO = o.xi.find(x => x.slot === 'GK' && x.p); const gk = gkO ? gkO.p : null;
      const push = Math.pow(Math.max(0.5, s.sec.att / Math.max(1, o.sec.def)), 1.5) * (minute > 65 ? 1.1 : 1) * Math.pow(0.85, s.reds) * (m.neutral ? 1 : si === 0 ? 1.1 : 0.9);
      if (rng() < P.penRate / 90 * push) {
        const tk = takerOf(s, 'pen'); if (!tk) return;

  function squadOf(st, clubId) { return st.rosters[clubId].map(id => st.players[id]); }
  // folha: quem está no elenco (emprestado para o clube paga a parte combinada) + a parte dos que o clube emprestou
  function wageBill(st, clubId) {
    let w = squadOf(st, clubId).reduce((a, p) => a + (p.loan && p.loan.owner !== clubId ? p.wage * p.loan.share : p.wage), 0);
    ((st.market && st.market.loans) || []).forEach(id => { const p = st.players[id]; if (p && p.loan && p.loan.owner === clubId) w += p.wage * (1 - p.loan.share); });
    return Math.round(w);
  }
  function strength(st, clubId) { return E.teamStrength(squadOf(st, clubId)); }
  function windowOpen(w) { return WINDOWS.some(([a, b]) => w >= a && w <= b); }
  function windowInfo(w) {
    for (const [a, b] of WINDOWS) { if (w >= a && w <= b) return { open: true, closesIn: C.weekNo(b) - C.weekNo(w) + 1 }; if (w < a) return { open: false, opensIn: C.weekNo(a) - C.weekNo(w) }; }
    return { open: false, opensIn: null };
  }

  function divClubs(st, d) { return Object.keys(st.clubs).filter(id => st.clubs[id].div === d); }
  function strengthRanks(st, d) { return (d ? divClubs(st, d) : Object.keys(st.clubs)).map(id => [id, strength(st, id)]).sort((a, b) => b[1] - a[1]).map(x => x[0]); }
  // metas por série (rank = posição de força na série; na Série D, dentro do grupo de 6)
  function targetFor(rank, div = 'A') {
    if (div === 'A') {
      if (rank <= 3) return { pos: 6, label: 'Brigar pelo título e terminar no G-6', role: 'Favorito', meta: 'G-6', press: 'alta' };
      if (rank <= 8) return { pos: 10, label: 'Terminar entre os 10 primeiros', role: 'Briga por vaga', meta: 'top 10', press: 'média' };
      if (rank <= 14) return { pos: 14, label: 'Terminar entre os 14 primeiros', role: 'Meio de tabela', meta: 'top 14', press: 'média' };
      return { pos: 16, label: 'Fugir do Z-4', role: 'Azarão', meta: 'fugir do Z-4', press: 'baixa' };
    }
    if (div === 'B') {
      if (rank <= 3) return { pos: 4, label: 'Subir para a Série A (G-4)', role: 'Favorito', meta: 'acesso', press: 'alta' };
      if (rank <= 8) return { pos: 8, label: 'Brigar pelo acesso e terminar entre os 8', role: 'Briga pelo acesso', meta: 'top 8', press: 'média' };
      if (rank <= 14) return { pos: 14, label: 'Terminar entre os 14 primeiros', role: 'Meio de tabela', meta: 'top 14', press: 'média' };
      return { pos: 16, label: 'Fugir do Z-4', role: 'Azarão', meta: 'fugir do Z-4', press: 'baixa' };
    }
    if (div === 'C') {
      if (rank <= 4) return { pos: 4, label: 'Terminar a 1ª fase entre os 4 e brigar pelo acesso', role: 'Favorito', meta: 'top 4', press: 'alta' };
      if (rank <= 10) return { pos: 8, label: 'Classificar ao quadrangular (top 8)', role: 'Briga por vaga', meta: 'top 8', press: 'média' };
      if (rank <= 15) return { pos: 14, label: 'Terminar entre os 14 primeiros', role: 'Meio de tabela', meta: 'top 14', press: 'média' };
      return { pos: 16, label: 'Fugir do Z-4', role: 'Azarão', meta: 'fugir do Z-4', press: 'baixa' };
    }
    if (rank <= 2) return { pos: 2, label: 'Terminar entre os 2 primeiros do grupo', role: 'Favorito', meta: 'top 2 do grupo', press: 'alta' };
    if (rank <= 4) return { pos: 4, label: 'Passar da fase de grupos (top 4 do grupo)', role: 'Briga por vaga', meta: 'top 4 do grupo', press: 'média' };
    return { pos: 5, label: 'Não terminar em último no grupo', role: 'Azarão', meta: 'fugir da lanterna', press: 'baixa' };
  }

  function newCareer(seed, clubId, coachName, persona) {
    const st = { v: 3, seed, year: 2026, round: 0, coach: { name: coachName || 'Técnico', persona, xp: 0, level: 1, club: clubId }, clubs: {}, players: {}, rosters: {}, comp: null, results: [], news: [], achievements: {}, finance: [], market: { neg: {}, offers: [], auction: null, auctionsDone: [] }, stats: { winStreak: 0, unbeaten: 0, clean: 0 }, history: [], morale: 55, board: { conf: 60 }, lineup: null, lastMatch: null, objectives: [], fired: false, seasonOver: false };
    const rng = rngFor(st, 'gen');
    let id = 1;
    const REAL = (typeof window !== 'undefined' && window.REAL_ROSTERS) || (typeof globalThis !== 'undefined' && globalThis.REAL_ROSTERS) || null;
    const forms = ['4-3-3', '4-4-2', '4-2-3-1'];
    E.CLUBS.forEach(c => {
      let squad;
      if (REAL && REAL[c.id]) {
        squad = REAL[c.id].map(row => E.realPlayer(rng, row, c.id, id++));
        // elencos curtos ganham garotos da base (nomes gerados) até 23, com 2 goleiros
        const ovrs = squad.map(p => p.ovr).sort((a, b) => a - b); const med = ovrs.length ? ovrs[Math.floor(ovrs.length / 2)] : 55;
        const add = pos => { const p = E.genPlayer(rng, pos, Math.max(45, med - 5 + rng.int(-2, 2)), rng.int(17, 20), c.id, id++); p.youth = true; squad.push(p); };
        while (squad.filter(p => p.pos === 'GK').length < 2) add('GK');
        const order = ['CB', 'ST', 'CM', 'RB', 'LB', 'DM', 'AM', 'LW', 'RW', 'CB', 'CM', 'ST']; let k = 0;
        while (squad.length < 23) add(order[k++ % order.length]);
      } else { squad = E.genSquad(rng, c, id); id += squad.length; }
      squad.forEach(p => { st.players[p.id] = p; p.mkt = 0.92 + rng() * 0.23; });
      st.rosters[c.id] = squad.map(p => p.id);
      st.clubs[c.id] = { ...c, cash: 0, tv: 0, wageCap: 0, formation: rng.pick(forms) };
    });
    // clubes estrangeiros das copas continentais
    E.FCLUBS.forEach(c => {
      const rows = E.FOREIGN && E.FOREIGN.R[c.id];
      const squad = rows && rows.length ? rows.map(row => E.realPlayer(rng, row, c.id, id++)) : E.genSquad(rng, c, id);
      if (!(rows && rows.length)) id += squad.length;
      squad.forEach(p => { st.players[p.id] = p; p.mkt = 1; });
      st.rosters[c.id] = squad.map(p => p.id);
      st.clubs[c.id] = { ...c, cash: 0, tv: 0, wageCap: 0, formation: rng.pick(forms) };
    });
    st.nextId = id;
    // escala de "base" (economia, ingresso): a Série A vai de 68 a 79 pela força; as outras séries seguem a mesma régua
    const sOf = {}; Object.keys(st.clubs).forEach(cid => sOf[cid] = strength(st, cid));
    const aS = Object.keys(st.clubs).filter(cid => st.clubs[cid].div === 'A').map(cid => sOf[cid]);
    const sMin = Math.min(...aS), sMax = Math.max(...aS);
    Object.values(st.clubs).forEach(c => { c.base = Math.round(Math.max(40, Math.min(85, 68 + (sOf[c.id] - sMin) / Math.max(1, sMax - sMin) * 11))); setEconomy(st, c); });
    splitSponsor(st, clubId);
    infra(st);
    startSeason(st);
    st.lineup = { ...E.autoLineup(squadOf(st, clubId), '4-3-3'), ment: 'equilibrada' };
    st.sponsor = null; st.sponsorOffers = sponsorOffers(st);
    life(st); st.coach.lic = st.clubs[clubId].div === 'A' ? 'PRO' : 'B'; checkLicense(st);
    pushNews(st, 'club', `${coachName} é o novo técnico do ${st.clubs[clubId].name}. Meta da diretoria: ${st.board.target.label.charAt(0).toLowerCase() + st.board.target.label.slice(1)}.`);
    st.life.presser = genPresser(st);
    return st;
  }
  // cota de TV semanal calibrada para cobrir a folha junto com a bilheteria esperada
  function setEconomy(st, c) {
    const wb = wageBill(st, c.id);
    c.ticket = Math.max(10, Math.round(25 + 2.5 * (c.base - 68)));
    const expGate = c.cap * Math.min(1, 0.30 + 0.45 * c.fan + 0.125) * c.ticket * HOME_SHARE[c.div];
    c.tv = Math.round(Math.max(0.3 * wb, 0.97 * wb - expGate) / 1000) * 1000;
    c.cash = Math.round(wb * Math.max(3, 5 + (c.base - 68) * 0.6) / 10000) * 10000;
    c.wageCap = Math.round(wb * 1.12 / 1000) * 1000;
  }

  // a cota do clube do usuario vira TV (60%) + patrocinio negociado (40% como referencia)
  function splitSponsor(st, clubId) {
    const c = st.clubs[clubId]; if (c.sponsorBase) return;
    const full = c.tv; c.tvFull = full; c.tv = Math.round(full * 0.6 / 1000) * 1000; c.sponsorBase = Math.round(full * 0.4 / 1000) * 1000;
  }

  function startSeason(st) {
    const rng = rngFor(st, 'season');
    const clubs = {}; Object.values(st.clubs).forEach(c => { if (c.div !== 'X') clubs[c.id] = { id: c.id, div: c.div, uf: c.uf }; });
    const sm = {}; Object.keys(st.clubs).forEach(id => sm[id] = strength(st, id));
    st.comp = C.buildSeason({ clubs, str: id => sm[id], rng, cont: contGroups(st) });
    st.cupEarned = 0; st.cupFinalPaid = false; st.contEarned = 0; st.contFinalPaid = {};
    if (st.coach && st.comp.cup[0] && st.comp.cup[0].some(t => t.a === st.coach.club || t.b === st.coach.club)) payCup(st, 0);
    st.results = [];
    st.round = 0; st.seasonOver = false;
    setTarget(st);
    Object.values(st.players).forEach(p => { p.g = 0; p.a = 0; p.apps = 0; p.rsum = 0; p.yc = 0; });
    genObjectives(st);
    genProspects(st);
    if (st.lineup) applyPresetFor(st);
  }
  function setTarget(st) {
    const me = st.coach.club, d = st.clubs[me].div; let rank;
    if (d === 'D') { const key = C.leagueKey(st.comp, me); rank = Object.keys(st.comp.tables[key]).sort((a, b) => strength(st, b) - strength(st, a)).indexOf(me) + 1; }
    else rank = strengthRanks(st, d).indexOf(me) + 1;
    st.board.target = { ...targetFor(rank, d), div: d }; st.board.rankStrength = rank; st.board.low = 0;
  }

  function pushNews(st, type, txt) { st.news.unshift({ y: st.year, r: st.round + 1, type, txt }); if (st.news.length > 80) st.news.length = 80; }
  // ---------- patrocinio (marcas ficticias do prototipo) ----------
  // empresas reais citadas so pelo nome (sem logo, sem cores da marca) como patrocinadoras no prototipo.
  // Fora da lista de proposito: casas de apostas, bebida alcoolica e tabaco.
  // art: artigo usado nas frases ("fecha com o Itaú", "com a Samsung").
  const BRANDS = [
    ['itau', 'Itaú', 'o', 'Banco'], ['bradesco', 'Bradesco', 'o', 'Banco'], ['bb', 'Banco do Brasil', 'o', 'Banco'], ['caixa', 'Caixa', 'a', 'Banco'],
    ['santander', 'Santander', 'o', 'Banco'], ['nubank', 'Nubank', 'o', 'Banco digital'], ['picpay', 'PicPay', 'o', 'Pagamentos'],
    ['cocacola', 'Coca-Cola', 'a', 'Bebidas'], ['guarana', 'Guaraná Antarctica', 'o', 'Bebidas'], ['pepsi', 'Pepsi', 'a', 'Bebidas'], ['gatorade', 'Gatorade', 'o', 'Bebidas'],
    ['sadia', 'Sadia', 'a', 'Alimentos'], ['seara', 'Seara', 'a', 'Alimentos'], ['nestle', 'Nestlé', 'a', 'Alimentos'], ['piracanjuba', 'Piracanjuba', 'a', 'Alimentos'],
    ['samsung', 'Samsung', 'a', 'Tecnologia'], ['motorola', 'Motorola', 'a', 'Tecnologia'],
    ['vivo', 'Vivo', 'a', 'Telefonia'], ['claro', 'Claro', 'a', 'Telefonia'], ['tim', 'TIM', 'a', 'Telefonia'],
    ['mercadolivre', 'Mercado Livre', 'o', 'Varejo'], ['magalu', 'Magalu', 'o', 'Varejo'], ['casasbahia', 'Casas Bahia', 'a', 'Varejo'], ['renner', 'Renner', 'a', 'Moda'],
    ['natura', 'Natura', 'a', 'Beleza'], ['boticario', 'Boticário', 'o', 'Beleza'], ['ype', 'Ypê', 'a', 'Limpeza'],
    ['petrobras', 'Petrobras', 'a', 'Energia'], ['ipiranga', 'Ipiranga', 'a', 'Combustível'],
    ['latam', 'LATAM', 'a', 'Aviação'], ['gol', 'Gol', 'a', 'Aviação'], ['azul', 'Azul', 'a', 'Aviação'],
    ['unimed', 'Unimed', 'a', 'Saúde'], ['localiza', 'Localiza', 'a', 'Aluguel de carros'], ['fiat', 'Fiat', 'a', 'Automóveis'], ['ifood', 'iFood', 'o', 'Delivery'],
  ].map(([id, name, art, cat]) => ({ id, name, art, cat }));
  const withB = b => `${b.art || 'a'} ${b.name}`;
  // valores em multiplos da base de patrocinio do clube (40% da cota antiga). Cada tipo tem um perfil de risco:
  // longo = seguro e com luvas na assinatura; alto = mais dinheiro agora, renovação depende do desempenho;
  // vitoria = paga mais para quem ganha muito; titulo = aposta alta, só para os favoritos.
  const SPONSOR_KINDS = {
    longo: { label: 'Contrato longo', rounds: 3 * SEASON_WEEKS, per: 0.95, signing: 3, pitch: (b, c) => `Parceria de três temporadas: ${b} paga luvas na assinatura e não mexe no valor, aconteça o que acontecer.` },
    alto: { label: 'Valor alto', rounds: SEASON_WEEKS, per: 1.0, pitch: (b, c) => `Uma temporada só, pagando mais. Na renovação, o valor acompanha a campanha do ${c}.` },
    vitoria: { label: 'Bônus por vitória', rounds: 2 * SEASON_WEEKS, per: 0.65, win: 0.8, pitch: (b, c) => `Fixo menor e um extra a cada vitória do ${c}. Rende mais para quem ganha muito.` },
    titulo: { label: 'Bônus por título', rounds: 2 * SEASON_WEEKS, per: 0.85, title: 20, pitch: (b, c) => `Se o ${c} ganhar a sua série ou a Copa do Brasil, ${b} paga um bônus grande no fim da temporada.` },
  };
  function sponsorPerf(st) {
    // campanha atual (ou a última) contra o lugar esperado pelo elenco (ranking de força):
    // cada posição acima vale +2%, abaixo −2%, entre −15% e +15%. Na média, um time que rende o que o elenco vale fica em 0%.
    if (st.round === 0 && !(st.history || []).length) return 1;
    const exp = st.board && st.board.rankStrength; if (!exp) return 1;
    const pos = st.round > 0 ? position(st) : st.history[st.history.length - 1].pos;
    return Math.max(0.85, Math.min(1.15, 1 + (exp - pos) * 0.02));
  }
  function sponsorOffers(st) {
    const c = st.clubs[st.coach.club]; const rng = rngFor(st, 'sponsor', st.year, st.round, c.id);
    const base = (c.sponsorBase || Math.round((c.tv || 0) * 0.4 / 1000) * 1000) * sponsorPerf(st);
    const rank = strengthRanks(st, c.div).indexOf(c.id) + 1;
    const kinds = ['longo', rank <= 4 ? 'titulo' : 'vitoria', 'alto'];
    const pool = BRANDS.slice(); const pick = () => pool.splice(Math.floor(rng() * pool.length), 1)[0];
    return kinds.map(k => {
      const K = SPONSOR_KINDS[k]; const b = pick(); const vary = 0.96 + rng() * 0.08;
      const per = Math.round(base * K.per * vary / 1000) * 1000;
      return { kind: k, label: K.label, brand: b, per, rounds: K.rounds, total: per * K.rounds,
        signing: K.signing ? Math.round(base * K.signing * vary / 10000) * 10000 : 0,
        winBonus: K.win ? Math.round(base * K.win * vary / 1000) * 1000 : 0,
        titleBonus: K.title ? Math.round(base * K.title * vary / 10000) * 10000 : 0,
        pitch: K.pitch(withB(b), c.name) };
    });
  }
  function signSponsor(st, i) {
    const o = (st.sponsorOffers || [])[i]; if (!o) return null;
    st.sponsor = { ...o, left: o.rounds, since: { y: st.year, r: st.round + 1 }, earned: 0 };
    st.sponsorOffers = [];
    if (o.signing) { money(st, 'sponsor', o.signing, `Luvas do patrocínio (${o.brand.name})`); st.sponsor.earned += o.signing; }
    pushNews(st, 'club', `${st.clubs[st.coach.club].name} fecha com ${withB(o.brand)}: ${fmt(o.per)} por rodada${o.signing ? ` e ${fmt(o.signing)} de luvas` : ''}${o.winBonus ? ` e ${fmt(o.winBonus)} por vitória` : ''}${o.titleBonus ? ` e ${fmt(o.titleBonus)} se for campeão` : ''}.`);
    return st.sponsor;
  }
  function migrate(st) {
    if (st.coach) { life(st); if (st.lineup && !st.lineup.takers) st.lineup.takers = {}; }
    Object.values(st.players || {}).forEach(p => { if (Array.isArray(p.at)) E.normAt(p); });
    Object.values(st.infra || {}).forEach(inf => (inf.prospects || []).forEach(p => { if (Array.isArray(p.at)) E.normAt(p); }));
    // loja antiga com estoque: devolve o estoque pelo custo e passa para a loja sem estoque
    Object.entries(st.infra || {}).forEach(([id, inf]) => {
      if (inf.stock > 0 && st.coach && id === st.coach.club) { const v = r1k(inf.stock * kitPrice(st, id) * 0.5); if (v) money(st, 'loja', v, `Loja: ${inf.stock.toLocaleString('pt-BR')} camisas do estoque antigo devolvidas ao fornecedor`); }
      delete inf.stock; delete inf.auto; delete inf.missed; if (!inf.boosts) inf.boosts = [];
      if (inf.hype > 1.6) inf.hype = 1.6;
    });
    // marcas antigas (ficticias) viram empresas da lista atual, mantendo os valores do contrato
    const known = b => b && BRANDS.some(x => x.id === b.id);
    if ((st.sponsorOffers || []).some(o => !known(o.brand))) st.sponsorOffers = sponsorOffers(st);
    if (st.sponsor && !known(st.sponsor.brand)) { st.sponsor.brand = BRANDS[hashSeed(st.sponsor.brand.id || 'x') % BRANDS.length]; st.sponsor.pitch = SPONSOR_KINDS[st.sponsor.kind].pitch(withB(st.sponsor.brand), st.clubs[st.coach.club].name); }
    return st;
  }
  function sponsorPending(st) { return !st.sponsor && (st.sponsorOffers || []).length > 0; }

  function money(st, type, amount, txt) { st.clubs[st.coach.club].cash += amount; st.finance.unshift({ y: st.year, r: st.round + 1, type, amount, txt }); if (st.finance.length > 120) st.finance.length = 120; }

  // ---------- jogos da semana ----------
  function weekFixtures(st, w = st.round) { return st.comp && w < WEEKS ? C.fixturesOf(st.comp, w) : []; }
  function userFixture(st, w = st.round) {
    const me = st.coach.club; const mt = weekFixtures(st, w).find(m => m.h === me || m.a === me);
    if (!mt) return null;
    const isHome = mt.h === me;
    return { h: mt.h, a: mt.a, home: isHome && !mt.neutral, isHome, neutral: !!mt.neutral, opp: isHome ? mt.a : mt.h, comp: mt.comp, label: mt.label, mt };
  }
  // próxima semana com jogo do usuário (a partir de w)
  function nextUserWeek(st, w = st.round) { for (let i = w; i < WEEKS; i++) { const fx = userFixture(st, i); if (fx) return { w: i, fx }; } return null; }
  function leagueKey(st, id = st.coach.club) { return C.leagueKey(st.comp, id); }
  function sortedTable(st, key = leagueKey(st)) { return key && st.comp.tables[key] ? C.sortRows(st.comp.tables[key]) : []; }
  function position(st, clubId = st.coach.club, key = leagueKey(st, clubId)) { const r = sortedTable(st, key).find(x => x.id === clubId); return r ? r.pos : null; }

  // ---------- objetivos da partida ----------
  function genObjectives(st) {
    const fx = userFixture(st); if (!fx) { st.objectives = []; return; }
    const rng = rngFor(st, 'obj', st.round);
    const diff = strength(st, fx.opp) - strength(st, st.coach.club);
    const result = [['win', 'Vença o jogo'], ['score2', 'Marque 2 gols ou mais'], ['clean', 'Não sofra gols']];
    if (!fx.isHome && !fx.neutral) result.push(['awaypt', 'Pontue fora de casa']);
    if (diff >= 3) result.push(['nolose', 'Não perca para um rival mais forte']);
    const mgmt = [['youth', 'Escale um titular de até 21 anos'], ['fitness', 'Comece com todos os titulares descansados'], ['bench', 'Use as 5 substituições']];
    const a = rng.pick(result), b = rng.pick(mgmt);
    const rest = result.concat(mgmt).filter(x => x !== a && x !== b && x[0] !== a[0]);
    const c = rng.pick(rest);
    st.objectives = [a, b, c].map(([id, txt]) => ({ id, txt, done: false, xp: 20 }));
  }

  function checkObjectives(st, ctx) {
    const bonus = Math.round(wageBill(st, st.coach.club) * 0.02 / 1000) * 1000;
    const done = [];
    st.objectives.forEach(o => {
      let ok = false;
      if (o.id === 'win') ok = ctx.gf > ctx.ga;
      if (o.id === 'score2') ok = ctx.gf >= 2;
      if (o.id === 'clean') ok = ctx.ga === 0;
      if (o.id === 'awaypt') ok = !ctx.home && ctx.gf >= ctx.ga;
      if (o.id === 'nolose') ok = ctx.gf >= ctx.ga;
      if (o.id === 'youth') ok = ctx.xiPlayers.some(p => p.age <= 21);
      if (o.id === 'fitness') ok = ctx.xiPlayers.every(p => p.condStart >= 75);
      if (o.id === 'bench') ok = ctx.subs >= 5;
      o.done = ok; if (ok) { done.push(o); money(st, 'bonus', bonus, `Bônus por objetivo: ${o.txt.toLowerCase()}`); }
    });
    return { done, bonus };
  }

  // ---------- partidas ----------
  function aiSide(st, clubId, oppId, isHome, rng) {
    const c = st.clubs[clubId]; const squad = squadOf(st, clubId);
    const lu = E.autoLineup(squad, c.formation);
    const ment = E.aiMentality(strength(st, clubId) - strength(st, oppId), isHome);
    return { club: clubId, xi: E.lineupFrom(clubId, st.players, lu), bench: lu.bench.map(i => st.players[i]), ment, persona: null, morale: 50 };
  }

  function userSide(st) {
    const lu = st.lineup; const me = st.coach.club; const squad = squadOf(st, me);
    const ok = id => id && st.players[id] && st.players[id].club === me && st.players[id].inj <= 0 && st.players[id].sus <= 0;
    const assist = st.coach.assist !== false;
    const fslots = E.FORMATIONS[lu.formation].slots;
    // a escalacao do tecnico fica salva; trocas do auxiliar valem so para este jogo

  // ---------- times salvos (fase 4) ----------
  const PRESETS = { tit: 'Titular', res: 'Reserva', copa: 'Copa' };
  const PRESET_COMP = { liga: 'Brasileiro', est: 'Estadual', cdb: 'Copa do Brasil' };
  function compKind(comp) { return comp === 'EST' ? 'est' : comp === 'CDB' ? 'cdb' : comp === 'LIB' || comp === 'SUL' ? 'cont' : 'liga'; }
  function savePreset(st, k) {
    if (!PRESETS[k]) return false; st.presets = st.presets || {};

    return true;

  function loadPreset(st, k) {

    st.lineup = { formation: pr.formation, slots: pr.slots.map(id => mine(id) ? id : null), bench: pr.bench.filter(mine), ment: pr.ment, takers: { ...(pr.takers || {}) } };
    // vaga de quem saiu do clube: o melhor disponível da posição
    const f = E.FORMATIONS[st.lineup.formation]; const used = new Set(st.lineup.slots.filter(Boolean));
    st.lineup.slots = st.lineup.slots.map((id, i) => { if (id) return id; let b = null, bv = -1; squadOf(st, me).forEach(p => { if (used.has(p.id) || p.inj > 0 || p.sus > 0) return; const v = E.effRating(p, f.slots[i][0], {}); if (v > bv) { bv = v; b = p; } }); if (b) used.add(b.id); return b ? b.id : null; });

  // no começo de cada semana com jogo: usa o time salvo escolhido para aquela competição

  function suggestMent(st) {
